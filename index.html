<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173b36" />
    <title>Tea Table · 排版编辑器</title>
    <link rel="stylesheet" href="./styles.css?v=fullscreen-preview-v1" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">✦</span><span>tea table</span><small>排版编辑器</small></div>
        <div class="top-actions">
          <span class="save-state" id="saveState">已保存</span>
          <button class="icon-button" id="undoBtn" title="撤销 (⌘/Ctrl + Z)" aria-label="撤销">↶</button>
          <button class="icon-button" id="redoBtn" title="重做 (⌘/Ctrl + Shift + Z)" aria-label="重做">↷</button>
          <button class="button ghost" id="previewBtn">预览</button>
          <button class="button primary" id="exportBtn">导出项目</button>
          <label class="button ghost file-button">导入项目<input id="importInput" type="file" accept="application/json" /></label>
        </div>
      </header>

      <section class="workspace">
        <aside class="sidebar pages-sidebar">
          <div class="panel-heading"><span>我的页面</span><button class="mini-button" id="newPageBtn" title="新建页面">＋</button></div>
          <div class="page-list" id="pageList"></div>
          <div class="sidebar-tip">每个页面独立保存布局<br />素材库在所有页面间共享</div>
        </aside>

        <section class="stage-wrap">
          <div class="stage-toolbar">
            <div class="crumb"><span class="eyebrow">CURRENT PAGE</span><strong id="currentPageName">下午茶海报</strong></div>
            <div class="stage-actions">
              <button class="tool-button" id="renamePageBtn">重命名</button>
              <button class="tool-button" id="clearPageBtn">清空画布</button>
              <span class="zoom-label" id="zoomLabel">100%</span>
              <button class="tool-button" id="zoomOutBtn">−</button><button class="tool-button" id="zoomInBtn">＋</button>
            </div>
          </div>
          <div class="canvas-area" id="canvasArea">
            <div class="canvas-board" id="canvasBoard" aria-label="画布"></div>
          </div>
          <div class="statusbar"><span>拖动空白处平移 · 滚轮上下移动 · 右上角缩放</span><span id="canvasSize">画布 900 × 640</span></div>
        </section>

        <aside class="sidebar right-sidebar">
          <section class="panel asset-panel" id="assetPanel">
            <div class="panel-heading"><span>美术资产库</span><label class="upload-button">上传图片<input id="assetInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple /></label></div>
            <p class="panel-note">透明 PNG 最适合做贴纸与装饰</p>
            <div class="asset-grid" id="assetGrid"></div>
          </section>
          <div class="panel-divider" id="assetLayerDivider" title="拖动调整资产库和图层区域大小"></div>
          <section class="panel layers-panel">
            <div class="panel-heading"><span>图层</span><span class="layer-count" id="layerCount">0 层</span></div>
            <div class="layer-list" id="layerList"></div>
          </section>
        </aside>
      </section>
    </main>

    <div class="modal-backdrop hidden" id="previewModal">
      <div class="preview-modal"><button class="close-button" id="closePreview">×</button><div class="preview-board" id="previewBoard"></div><div class="preview-transition-mask" id="previewTransitionMask" aria-hidden="true"></div><p>预览模式 · 按 Esc 关闭</p></div>
    </div>
    <div class="modal-backdrop hidden" id="pageDialog">
      <form class="page-dialog" id="pageDialogForm">
        <div class="dialog-heading"><span id="pageDialogTitle">新建页面</span><button type="button" class="close-button" id="closePageDialog">×</button></div>
        <input id="pageNameInput" maxlength="40" autocomplete="off" />
        <div class="dialog-actions"><button type="button" class="button ghost" id="cancelPageDialog">取消</button><button type="submit" class="button primary">确定</button></div>
      </form>
    </div>
    <div class="context-menu hidden" id="contextMenu"><button id="deleteContextItem">删除图层</button></div>
    <div class="toast" id="toast"></div>
    <script src="./assets/vendor/gsap.min.js"></script>
<script src="./app.js?v=default-preview-v1"></script>
  </body>
</html>
